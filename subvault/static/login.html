<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Private Console</title>
  <link rel="stylesheet" href="/vault/static/styles.css?v=0.3.0">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section class="login-shell">
    <div class="login-card">
      <div class="brand brand-login"><span class="brand-mark">S</span><span>SV Console</span></div>
      <p class="eyebrow">PRIVATE SERVICE CONSOLE</p>
      <h1>欢迎回来</h1>
      <p class="muted">登录后进入私人控制台。</p>
      <form id="loginForm" class="form-stack">
        <label>管理员账号<input name="username" autocomplete="username" value="admin" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" class="btn primary wide" type="submit">进入控制台</button>
      </form>
      <p class="login-note">登录受到速率限制，Cookie 仅限安全连接使用。</p>
    </div>
    <div class="login-visual" aria-hidden="true">
      <div class="orb orb-one"></div><div class="orb orb-two"></div>
      <div class="visual-card"><span>访问策略</span><strong>独立 Token</strong><i></i></div>
      <div class="visual-card small"><span>服务状态</span><strong>安全连接</strong><i></i></div>
    </div>
  </section>
  <script src="/vault/static/login.js?v=0.3.0" defer></script>
</body>
</html>
